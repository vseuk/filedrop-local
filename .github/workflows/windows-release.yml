name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean FileDrop.spec

      - name: Prepare release archive
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "nightly-${{ github.sha }}" }
          $folder = "FileDrop-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item dist\\FileDrop.exe "$folder\\FileDrop.exe"
          Copy-Item README.md "$folder\\README.md"
          Copy-Item LICENSE "$folder\\LICENSE"
          Compress-Archive -Path "$folder\\*" -DestinationPath "$folder.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDrop-windows-x64
          path: |
            dist/FileDrop.exe
            FileDrop-*.zip

      - name: Attach files to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FileDrop.exe
            FileDrop-*.zip
